[project]
name = "zashterminal"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Terminals :: Terminal Emulators/X Terminals",
]
version = "0.8.22"
authors = [
    { name = "Leonardo Berbert", email = "leo4berbert@gmail.com" },
]
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
readme = "README.md"
# dataclass(slots=True) and other runtime features require 3.10+
requires-python = ">=3.10"
# Core runtime only. Optional features live under [project.optional-dependencies]
# (Arch PKGBUILD may still hard-depend the extras for a full system install).
dependencies = [
    "pywal16>=3.8,<4",
    "PyGObject",
    "pycairo",
    "setproctitle",
    "requests",
    "psutil",
    "pycryptodomex",
]

[project.gui-scripts]
zashterminal = "zashterminal:main"

[project.urls]
Homepage = "https://github.com/leoberbert/zashterminal"
Issues = "https://github.com/leoberbert/zashterminal/issues"

[project.optional-dependencies]
performance = ["regex"]
syntax-highlighting = ["Pygments"]
backup = ["py7zr"]
all = ["regex", "Pygments", "py7zr"]
# coverage[toml] is required on Python <3.11 to read [tool.coverage] from pyproject.toml
dev = ["coverage[toml]>=7.0"]

[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

[tool.setuptools.packages.find]
include = ["zashterminal"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
zashterminal = ["**/*"]

[tool.setuptools.data-files]
"share/applications" = ["usr/share/applications/org.leoberbert.zashterminal.desktop"]
"share/icons/hicolor/scalable/apps" = ["usr/share/icons/hicolor/scalable/apps/zashterminal.svg"]
"share/pixmaps" = ["usr/share/icons/hicolor/scalable/apps/zashterminal.svg"]

[tool.coverage.run]
source = ["src/zashterminal"]
branch = false
omit = [
    "*/ui/dialogs/*",
    "*/ui/widgets/*",
    "*/ui/window_search_broadcast.py",
    "*/ui/window_ui.py",
    "*/ui/actions.py",
    "*/ui/sidebar_manager.py",
    "*/filemanager/*",
    "*/terminal/manager.py",
    "*/terminal/manager_*.py",
    "*/terminal/_highlighter_impl.py",
    "*/terminal/tabs.py",
    "*/terminal/spawner.py",
    "*/window.py",
    "*/app.py",
]

[tool.coverage.report]
precision = 1
show_missing = false
skip_empty = true
# Floor against total measured source (UI dialogs/widgets/filemanager omitted).
# Raise deliberately as more modules gain tests — do not lower without cause.
fail_under = 15
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
