# SonarQube Cloud project metadata.
# Create the project at https://sonarcloud.io and set GitHub secrets:
#   SONAR_TOKEN          — from SonarQube Cloud → My Account → Security
#   SONAR_ORGANIZATION   — optional override (default: leoberbert)
#
# Project key must match the key created in SonarQube Cloud.
sonar.projectKey=leoberbert_zashterminal
sonar.organization=leoberbert
sonar.projectName=Zashterminal

sonar.sources=src
sonar.tests=tests
sonar.sourceEncoding=UTF-8
sonar.python.version=3.10,3.11,3.12,3.13

sonar.exclusions=\
  **/__pycache__/**,\
  **/*.svg,\
  **/*.png,\
  **/locale/**,\
  **/.venv/**

sonar.test.exclusions=**/__pycache__/**
sonar.coverage.exclusions=\
  **/ui/dialogs/**,\
  **/ui/widgets/**,\
  **/filemanager/**

# Produced by the Tests workflow (coverage.xml artifact / local coverage xml).
sonar.python.coverage.reportPaths=coverage.xml
