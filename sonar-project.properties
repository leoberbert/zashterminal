# SonarQube Cloud project metadata.
# Create the project at https://sonarcloud.io and set GitHub secrets:
#   SONAR_TOKEN          — from SonarQube Cloud → My Account → Security
#   SONAR_ORGANIZATION   — optional override (default: leoberbert)
#
# Project key must match the key created in SonarQube Cloud.
sonar.projectKey=leoberbert_zashterminal
sonar.organization=leoberbert
sonar.projectName=Zashterminal

sonar.sources=src
sonar.tests=tests
sonar.sourceEncoding=UTF-8
sonar.python.version=3.10,3.11,3.12,3.13

sonar.exclusions=\
  **/__pycache__/**,\
  **/*.svg,\
  **/*.png,\
  **/locale/**,\
  **/.venv/**

sonar.test.exclusions=**/__pycache__/**

# GTK/VTE UI and large manager surfaces are exercised manually / via mixins.
# Refactors that move them into new files would otherwise fail the default
# "Coverage on New Code ≥ 80%" gate despite no behavior change.
sonar.coverage.exclusions=\
  **/__init__.py,\
  **/ui/dialogs/**,\
  **/ui/widgets/**,\
  **/ui/window_search_broadcast.py,\
  **/ui/window_ui.py,\
  **/ui/actions.py,\
  **/ui/sidebar_manager.py,\
  **/filemanager/**,\
  **/terminal/manager.py,\
  **/terminal/manager_*.py,\
  **/terminal/_highlighter_impl.py,\
  **/terminal/tabs.py,\
  **/terminal/spawner.py,\
  **/window.py,\
  **/app.py

# Produced by the Tests workflow (coverage.xml artifact / local coverage xml).
sonar.python.coverage.reportPaths=coverage.xml
