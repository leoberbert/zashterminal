# SonarQube Cloud project metadata.
# Create the project at https://sonarcloud.io and set GitHub secrets:
#   SONAR_TOKEN          — from SonarQube Cloud → My Account → Security
#   SONAR_ORGANIZATION   — optional override (default: leoberbert)
#
# Project key must match the key created in SonarQube Cloud.
sonar.projectKey=leoberbert_zashterminal
sonar.organization=leoberbert
sonar.projectName=Zashterminal

sonar.sources=src
sonar.tests=tests
sonar.sourceEncoding=UTF-8
sonar.python.version=3.10,3.11,3.12,3.13

sonar.exclusions=\
  **/__pycache__/**,\
  **/*.svg,\
  **/*.png,\
  **/locale/**,\
  **/.venv/**

sonar.test.exclusions=**/__pycache__/**

# mRemoteNG confCons.xml passwords use format-mandated MD5/AES-CBC and
# PBKDF2-HMAC-SHA1; these rules flag the interoperability decryptors only.
sonar.issue.ignore.multicriteria=mremote-cbc,mremote-hash,gtk-css-type,gtk-css-pseudo,gtk-css-atrule,gtk-css-value
sonar.issue.ignore.multicriteria.mremote-cbc.ruleKey=python:S5542
sonar.issue.ignore.multicriteria.mremote-cbc.resourceKey=**/utils/mremoteng_import.py
sonar.issue.ignore.multicriteria.mremote-hash.ruleKey=python:S4790
sonar.issue.ignore.multicriteria.mremote-hash.resourceKey=**/utils/mremoteng_import.py

# The stylesheets are GTK4/libadwaita CSS, not web CSS. Sonar's web-CSS rules
# flag GTK widget nodes (headerbar, row, popover...), :backdrop/:selected,
# @define-color and currentColor/black as "unknown" -- all valid in GTK.
sonar.issue.ignore.multicriteria.gtk-css-type.ruleKey=css:S4670
sonar.issue.ignore.multicriteria.gtk-css-type.resourceKey=**/data/styles/*.css
sonar.issue.ignore.multicriteria.gtk-css-pseudo.ruleKey=css:S4659
sonar.issue.ignore.multicriteria.gtk-css-pseudo.resourceKey=**/data/styles/*.css
sonar.issue.ignore.multicriteria.gtk-css-atrule.ruleKey=css:S4662
sonar.issue.ignore.multicriteria.gtk-css-atrule.resourceKey=**/data/styles/*.css
sonar.issue.ignore.multicriteria.gtk-css-value.ruleKey=css:S9424
sonar.issue.ignore.multicriteria.gtk-css-value.resourceKey=**/data/styles/*.css

# GTK/VTE UI and large manager surfaces are exercised manually / via mixins.
# Refactors that move them into new files would otherwise fail the default
# "Coverage on New Code ≥ 80%" gate despite no behavior change.
sonar.coverage.exclusions=\
  **/__init__.py,\
  **/ui/dialogs/**,\
  **/ui/widgets/**,\
  **/ui/window_search_broadcast.py,\
  **/ui/window_ui.py,\
  **/ui/actions.py,\
  **/ui/sidebar_manager.py,\
  **/filemanager/**,\
  **/terminal/manager.py,\
  **/terminal/manager_*.py,\
  **/terminal/_highlighter_impl.py,\
  **/terminal/tabs.py,\
  **/terminal/spawner.py,\
  **/window.py,\
  **/app.py

# Produced by the Tests workflow (coverage.xml artifact / local coverage xml).
sonar.python.coverage.reportPaths=coverage.xml
