name: Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install system libraries for PyGObject / wallpaper
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgirepository-2.0-dev \
            gcc \
            libcairo2-dev \
            pkg-config \
            python3-dev \
            gir1.2-glib-2.0 \
            gir1.2-freedesktop \
            gir1.2-gdkpixbuf-2.0 \
            gir1.2-gtk-4.0 \
            gir1.2-adw-1 \
            gir1.2-vte-3.91 \
            gir1.2-pango-1.0 \
            gir1.2-secret-1 \
            libgtk-4-1 \
            libadwaita-1-0 \
            libvte-2.91-gtk4-0 \
            libsecret-1-0 \
            imagemagick

      - name: Install Python test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            'pywal16>=3.8,<4' \
            pycryptodomex \
            PyGObject \
            pycairo \
            requests \
            psutil

      - name: Verify package import smoke
        env:
          PYTHONPATH: src
        run: |
          python -c "import zashterminal; print(zashterminal.__name__)"
          python -c "from zashterminal.utils import crypto, security, platform; print('utils-ok')"
          python scripts/sync_version.py --check

      - name: Run unit tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
