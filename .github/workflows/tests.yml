name: Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system libraries for PyGObject / wallpaper
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgirepository-2.0-dev \
            gcc \
            libcairo2-dev \
            pkg-config \
            python3-dev \
            gir1.2-glib-2.0 \
            gir1.2-freedesktop \
            gir1.2-gdkpixbuf-2.0 \
            gir1.2-gtk-4.0 \
            gir1.2-adw-1 \
            gir1.2-vte-3.91 \
            gir1.2-pango-1.0 \
            gir1.2-secret-1 \
            libgtk-4-1 \
            libadwaita-1-0 \
            libvte-2.91-gtk4-0 \
            libsecret-1-0 \
            imagemagick

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          # Core deps + coverage[toml] from pyproject (toml needed on Py<3.11)
          # extras (regex/Pygments/py7zr) stay optional
          python -m pip install -e ".[dev]"

      - name: Verify package import smoke
        env:
          PYTHONPATH: src
        run: |
          python -c "import zashterminal; print(zashterminal.__name__)"
          python -c "from zashterminal.utils import crypto, security, platform; print('utils-ok')"
          python scripts/sync_version.py --check

      - name: Run unit tests with coverage
        env:
          PYTHONPATH: src
        run: |
          python -m coverage run -m unittest discover -s tests -v
          python -m coverage report
          python -m coverage xml -o coverage.xml

      - name: Upload coverage XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-py${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: ignore
